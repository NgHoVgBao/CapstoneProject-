<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Web Server</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 72px;
            color: #040339;
            font-weight: 700;
        }

        .btn-login {
            display: inline-block;
            padding: 14px 32px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }

        .btn-login:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="container"> 
        <h1>STAFF MANAGEMENT DASHBOARD</h1>
        <!-- Sửa href="login.html" thành "/login" hoặc đường dẫn Route tương ứng trên Backend -->
        <a href="/login" class="btn-login">Sign In</a>
    </div>
</body>
</html>
