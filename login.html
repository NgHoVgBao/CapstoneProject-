<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Staff Management</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            font-family: Arial, sans-serif;
        }

        .login-container {
            background: #808080;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 14px;
            background: #f5f5f5;
            color: #333;
            transition: 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #0b5ed7;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        /* Kiểu thông báo hiển thị phía dưới nút */
        .status-msg {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            display: none; /* Mặc định ẩn */
            animation: slideDown 0.3s ease;
        }

        /* Kiểu Đăng nhập thành công (màu xanh) */
        .status-msg.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        /* Kiểu Đăng nhập thất bại (màu đỏ) */
        .status-msg.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h1>Log In</h1>
        <form onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" name="password" placeholder="Enter password" 
                    autocomplete="off" 
                    onfocus="this.type='password'" 
                    onblur="if(this.value==='') this.type='text'" 
                    required>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">Log In</button>
        </form>

        <div id="statusMessage" class="status-msg"></div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('statusMessage');
            const btnLogin = document.getElementById('btnLogin');

            // Reset trạng thái thông báo
            msgBox.className = 'status-msg';

            if (username === 'baonguyen' && password === 'monitor123') {
                msgBox.textContent = '✓ Đăng nhập thành công! Đang chuyển hướng...';
                msgBox.classList.add('success');
                btnLogin.disabled = true;
                setTimeout(() => {
                    window.location.href = 'monitor.html';
                }, 2000);

            } else {
                // 1. Hiện thông báo THẤT BẠI màu đỏ
                msgBox.textContent = '✕ Đăng nhập thất bại, kiểm tra tài khoản hoặc mật khẩu';
                msgBox.classList.add('error');
            }
        }
    </script>
</body>
</html>
